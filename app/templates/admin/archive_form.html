{% extends "base.html" %}
{% block title %}总结上传{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-box-arrow-up me-2 text-primary"></i>上传活动总结</h4>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            {% set v = form %}
            <form method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">选择活动 <span class="text-danger">*</span></label>
                    <select name="activity_id" class="form-select" required>
                        <option value="">-- 请选择活动 --</option>
                        {% for a in activities %}
                        <option value="{{ a.id }}" {% if v.get('activity_id')|int == a.id %}selected{% endif %}>
                            {{ a.title }}（{{ a.start_time.strftime('%Y-%m-%d') }}）
                        </option>
                        {% endfor %}
                    </select>
                    <div class="form-text">仅可选择尚未归档的活动。</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">学期 <span class="text-danger">*</span></label>
                    <input type="text" name="semester" class="form-control" required placeholder="例如：2026-2027-1" value="{{ v.get('semester','') }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">活动总结 <span class="text-danger">*</span></label>
                    <textarea name="summary" class="form-control" rows="8" required placeholder="请输入活动总结内容...">{{ v.get('summary','') }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">附件（选填）</label>
                    <input type="file" name="attachment" class="form-control">
                    <div class="form-text">支持 pdf/word/excel/ppt/txt/zip 等，单文件不超过 20MB。</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-archive me-1"></i>提交归档</button>
                    <a href="{{ url_for('admin.archive_list') }}" class="btn btn-outline-secondary">查看归档</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
