{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body p-4">
        <h3 class="text-center mb-1">注册新账号</h3>
        <p class="text-center text-secondary mb-4">默认注册为学生身份</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">用户名 <span class="text-danger">*</span></label>
                <input type="text" name="username" class="form-control" value="{{ form.get('username','') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码 <span class="text-danger">*</span></label>
                <input type="password" name="password" class="form-control" minlength="6" required>
                <div class="form-text">不少于 6 位</div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">真实姓名</label>
                    <input type="text" name="real_name" class="form-control" value="{{ form.get('real_name','') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">学号</label>
                    <input type="text" name="student_id" class="form-control" value="{{ form.get('student_id','') }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">邮箱</label>
                    <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">手机号</label>
                    <input type="text" name="phone" class="form-control" value="{{ form.get('phone','') }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-person-plus me-1"></i>注册</button>
        </form>
        <div class="text-center mt-3">
            <span class="text-secondary">已有账号？</span>
            <a href="{{ url_for('auth.login') }}">去登录</a>
        </div>
    </div>
</div>
{% endblock %}
