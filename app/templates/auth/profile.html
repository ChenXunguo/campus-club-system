{% extends "base.html" %}
{% block title %}个人中心{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card mb-4">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3" style="width:64px;height:64px;font-size:1.6rem;font-weight:700;">
                        {{ current_user.username[0] | upper }}
                    </div>
                    <div>
                        <h4 class="mb-0">{{ current_user.real_name or current_user.username }}</h4>
                        <span class="badge bg-primary mt-1">{{ current_user.role_label }}</span>
                        {% if current_user.club %}
                            <span class="badge bg-info text-dark mt-1 ms-1">{{ current_user.club.name }}</span>
                        {% endif %}
                    </div>
                </div>

                <form method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">学号</label>
                            <input type="text" name="student_id" class="form-control" value="{{ current_user.student_id or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">真实姓名</label>
                            <input type="text" name="real_name" class="form-control" value="{{ current_user.real_name or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">手机号</label>
                            <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}">
                        </div>
                    </div>
                    <hr>
                    <h6 class="text-secondary mb-3"><i class="bi bi-key me-1"></i>修改密码（选填）</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">原密码</label>
                            <input type="password" name="old_password" class="form-control" autocomplete="current-password">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">新密码</label>
                            <input type="password" name="new_password" class="form-control" minlength="6" autocomplete="new-password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存修改</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
