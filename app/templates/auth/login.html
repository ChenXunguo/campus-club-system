{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body p-4">
        <h3 class="text-center mb-1">欢迎回来</h3>
        <p class="text-center text-secondary mb-4">登录校园社团活动管理系统</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" value="{{ username or '' }}" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                <label class="form-check-label" for="remember">记住我（7天）</label>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>登录</button>
        </form>
        <div class="text-center mt-3">
            <span class="text-secondary">还没有账号？</span>
            <a href="{{ url_for('auth.register') }}">立即注册</a>
        </div>
    </div>
</div>
{% endblock %}
